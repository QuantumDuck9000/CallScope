[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "callscope"
version = "0.4.4"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "jinja2>=3.0",
    "lxml>=4.9",
    "rich>=13.0",
    "dpkt>=1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4",
    "mypy>=1.0",
    "build>=1.0",
    "scapy>=2.5",
]

[project.scripts]
callscope = "callscope.cli:main"

[project.urls]
"Source" = "https://github.com/your-org/callscope"
"Issue Tracker" = "https://github.com/your-org/callscope/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["callscope*"]

[tool.setuptools.package-data]
"callscope.reporting" = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["callscope"]
omit = ["tests/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["callscope"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["scapy.*", "lxml.*", "dpkt.*"]
ignore_missing_imports = true
